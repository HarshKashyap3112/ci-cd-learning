name: CD Pipeline to AWS App Runner (Staging and Production)

on:
  push:
    branches:
      - staging
  workflow_dispatch: {}
  release:
    types:
      - published

env:
  PORT: 5001

jobs:
  test:
    runs-on: ubuntu-latest
    name: Setup, test, and build project
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        
      - name: Install dependencies
        run: npm ci
        
      - name: Test application
        run: npm test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    name: Build, Push to ECR, and Deploy to App Runner
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to AWS App Runner - Staging
        if: github.ref != 'refs/heads/main'
        uses: awslabs/amazon-app-runner-deploy@main
        with:
          service: ${{ vars.AWS_STAGING_SERVICE_NAME }}
          image: ${{ vars.IMAGE }}
          access-role-arn: ${{ secrets.APP_RUNNER_ROLE_ARN }}
          region: ${{ vars.AWS_REGION }}
          cpu: 1
          memory: 2
          port: ${{ env.PORT }}

      - name: Deploy to AWS App Runner - Production
        if: github.event_name == 'release' && github.event.action == 'published' && github.event.release.target_commitish == 'main'
        uses: awslabs/amazon-app-runner-deploy@main
        with:
          service: ${{ vars.AWS_PRODUCTION_SERVICE_NAME }}
          image: ${{ vars.IMAGE }}
          access-role-arn: ${{ secrets.APP_RUNNER_ROLE_ARN }}
          region: ${{ vars.AWS_REGION }}
          cpu: 1
          memory: 2
          port: ${{ env.PORT }}